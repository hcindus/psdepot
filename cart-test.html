<!DOCTYPE html>
<html>
<head><title>Cart Test</title><style>
@keyframes patriotic-blink {
    0%, 100% { color: #ff0000; text-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }
    33% { color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
    66% { color: #0066ff; text-shadow: 0 0 8px rgba(0, 102, 255, 0.6); }
}
.patriotic-phone { animation: patriotic-blink 2s infinite; font-weight: 700; display: inline-block; }
</style>
</head>
<body>
<header style="background:#0A1A2F;color:#fff;padding:10px 20px;text-align:center;"><a href="tel:888-881-6834" class="patriotic-phone" style="text-decoration:none;">📞 (888) 881-6834</a> <a href="tel:415-571-9724" style="text-decoration:none;">📞 (415) 571-9724</a> <a href="mailto:info@psdepot.com" style="text-decoration:none;">✉️ info@psdepot.com</a></header>

    <h1>Cart Diagnostic</h1>
    <div id="output"></div>
    <script>
        const output = document.getElementById('output');
        
        // Check what's in localStorage
        const cartData = localStorage.getItem('psdepot_cart');
        output.innerHTML += '<h2>Raw localStorage:</h2>';
        output.innerHTML += '<pre>' + (cartData || 'EMPTY') + '</pre>';
        
        if (cartData) {
            const cart = JSON.parse(cartData);
            output.innerHTML += '<h2>Parsed cart items:</h2>';
            cart.forEach((item, i) => {
                output.innerHTML += `<p>${i+1}. SKU: ${item.sku}, Name: ${item.name}, Qty: ${item.quantity}, Price: $${item.price}</p>`;
            });
            output.innerHTML += '<h3>Total items: ' + cart.reduce((s, i) => s + i.quantity, 0) + '</h3>';
        }
        
        // Test adding an item
        output.innerHTML += '<hr><h2>Add Test Item:</h2>';
        output.innerHTML += '<button onclick="testAdd()">Add Test Item</button>';
        
        function testAdd() {
            let cart = JSON.parse(localStorage.getItem('psdepot_cart') || '[]');
            cart.push({sku: 'TEST-001', name: 'Test Product', price: 9.99, quantity: 1});
            localStorage.setItem('psdepot_cart', JSON.stringify(cart));
            location.reload();
        }
    </script>
<footer style="background:#0A1A2F;color:#fff;padding:20px;text-align:center;font-size:14px;"><p><a href="tel:888-881-6834" class="patriotic-phone" style="text-decoration:none;">📞 (888) 881-6834</a></p></footer>
</body>
</html>
