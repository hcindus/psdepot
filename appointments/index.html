<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PSD Appointments | Performance Supply Depot</title>
    <script>
        // Check if user is logged in with web folder tokens, otherwise redirect to login
        const token = localStorage.getItem('psd_accessToken') || sessionStorage.getItem('psd_accessToken');
        if (!token) {
            window.location.href = '/appointments/web/login.html';
        } else {
            window.location.href = '/appointments/web/dashboard.html';
        }
    </script>
</head>
<body>
    <p>Redirecting to login...</p>
</body>
</html>
