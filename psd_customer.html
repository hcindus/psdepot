<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Detail - Performance Supply Depot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="psd-shell.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(90deg, #0f3460 0%, #16213e 100%);
            padding: 20px 40px;
            border-bottom: 3px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #fff; font-size: 28px; }
        .header .subtitle { color: #e94560; font-size: 14px; }
        .nav-tabs {
            display: flex;
            background: #0f3460;
            border-bottom: 1px solid #1a1a2e;
        }
        .nav-tab {
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #a0a0a0;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-tab:hover { color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .card h3 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #e94560;
            border-radius: 2px;
        }
        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-label {
            width: 150px;
            color: #a0a0a0;
            font-size: 13px;
        }
        .info-value {
            flex: 1;
            color: #fff;
            font-size: 14px;
        }
        .tier-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .tier-top165 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a1a2e; }
        .tier-spoton { background: rgba(0, 180, 216, 0.2); color: #00b4d8; }
        .tier-prime { background: rgba(157, 78, 221, 0.2); color: #9d4edd; }
        .tier-ppcl { background: rgba(230, 57, 70, 0.2); color: #e63946; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn:hover { background: #d63d56; transform: translateY(-2px); }
        .btn-secondary {
            background: rgba(15, 52, 96, 0.6);
            border: 1px solid rgba(233, 69, 96, 0.3);
        }
        .btn-secondary:hover { background: rgba(233, 69, 96, 0.3); }
        .loading { text-align: center; padding: 40px; color: #a0a0a0; }
        .error { background: rgba(248, 113, 113, 0.1); border: 1px solid #f87171; color: #f87171; padding: 16px; border-radius: 8px; margin: 20px 0; }
        .chart-container { position: relative; height: 300px; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        th {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        tr:hover { background: rgba(255, 255, 255, 0.03); }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🏭 Performance Supply Depot</h1>
            <div class="subtitle">Customer Detail View</div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 24px; color: #e94560; font-weight: bold;" id="customerName">Loading...</div>
            <button class="btn btn-secondary" onclick="history.back()" style="margin-top: 10px;">← Back</button>
        </div>
    </div>

    <div class="nav-tabs">
        <a href="psd_dashboard.html" class="nav-tab">← Dashboard</a>
        <a href="psd_dashboard.html#customers" class="nav-tab">← Customers</a>
        <span class="nav-tab" style="color: #fff;">👤 Customer Detail</span>
    </div>

    <div class="container" id="container">
        <div id="loading" class="loading">Loading customer data...</div>
        <div id="content" style="display: none;">
            <div class="dashboard-grid">
                <div class="card">
                    <h3>📋 Business Information</h3>
                    <div id="businessInfo"></div>
                </div>
                
                <div class="card">
                    <h3>📞 Contact Details</h3>
                    <div id="contactInfo"></div>
                </div>
            </div>

            <div class="card">
                <h3>💰 Sales History</h3>
                <div class="chart-container" style="height: 250px; margin-bottom: 20px;">
                    <canvas id="salesChart"></canvas>
                </div>
                <div class="table-container">
                    <table id="salesTable">
                        <thead>
                            <tr><th>Year</th><th>Month</th><th>Amount</th><th>YTD</th></tr>
                        </thead>
                        <tbody id="salesTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h3>🎯 Actions</h3>
                <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;">
                    <button class="btn" onclick="recordContact()">✓ Record Contact</button>
                    <a id="depotChaosLink" href="#" class="btn" target="_blank">📂 Open in DepotChaos</a>
                    <button class="btn btn-secondary" onclick="exportCustomer()">📤 Export</button>
                </div>
                <div id="actionMessage" style="margin-top: 15px; color: #4ade80;"></div>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:8081' 
            : (window.location.hostname.includes('psdepot.com') ? '/psd-api' : '');
        let customerId = null;
        let customerData = null;
        let chart = null;

        function getCustomerId() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) {
                const hash = window.location.hash;
                if (hash) return hash.replace('#', '').replace('/customer/', '');
            }
            return id;
        }

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (e) {
                console.error('API Error:', e);
                throw e;
            }
        }

        async function loadCustomer() {
            customerId = getCustomerId();
            
            if (!customerId) {
                showError('No customer ID provided');
                return;
            }

            try {
                const data = await fetchAPI(`/customers/${customerId}`);
                customerData = data;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                document.getElementById('customerName').textContent = data.customer.business_name;
                document.getElementById('depotChaosLink').href = `/depotchaos/#/customer/${customerId}`;
                
                renderBusinessInfo(data.customer);
                renderContactInfo(data.customer);
                renderSalesHistory(data.sales_history);
                
            } catch (e) {
                showError(`Failed to load customer: ${e.message}`);
            }
        }

        function renderBusinessInfo(c) {
            const tierClass = getTierClass(c.category);
            const html = `
                <div class="info-row"><div class="info-label">Business Name:</div><div class="info-value">${escapeHtml(c.business_name)}</div></div>
                <div class="info-row"><div class="info-label">Category:</div><div class="info-value"><span class="tier-badge ${tierClass}">${escapeHtml(c.category || 'N/A')}</span></div></div>
                <div class="info-row"><div class="info-label">System Type:</div><div class="info-value">${escapeHtml(c.system_type || 'N/A')}</div></div>
                <div class="info-row"><div class="info-label">Status:</div><div class="info-value" style="color: #4ade80;">${escapeHtml(c.status || 'active')}</div></div>
                <div class="info-row"><div class="info-label">Source:</div><div class="info-value">${escapeHtml(c.source_sheet || 'N/A')}</div></div>
                <div class="info-row"><div class="info-label">Address:</div><div class="info-value">${escapeHtml(c.street_address || 'N/A')}</div></div>
                <div class="info-row"><div class="info-label">City:</div><div class="info-value">${escapeHtml(c.city || 'N/A')}, ${escapeHtml(c.state || '')} ${escapeHtml(c.zipcode || '')}</div></div>
            `;
            document.getElementById('businessInfo').innerHTML = html;
        }

        function renderContactInfo(c) {
            const html = `
                <div class="info-row"><div class="info-label">Contact Name:</div><div class="info-value">${escapeHtml(c.contact_name || 'N/A')}</div></div>
                <div class="info-row"><div class="info-label">Phone:</div><div class="info-value">${escapeHtml(c.phone || 'N/A')}</div></div>
                <div class="info-row"><div class="info-label">Phone 2:</div><div class="info-value">${escapeHtml(c.phone2 || 'N/A')}</div></div>
                <div class="info-row"><div class="info-label">Email:</div><div class="info-value">${escapeHtml(c.email || 'N/A')}</div></div>
                <div class="info-row"><div class="info-label">Last Contact:</div><div class="info-value">${c.last_contact ? new Date(c.last_contact).toLocaleDateString() : 'Never'}</div></div>
                <div class="info-row"><div class="info-label">Next Predicted:</div><div class="info-value">${c.next_predicted_contact ? new Date(c.next_predicted_contact).toLocaleDateString() : 'N/A'}</div></div>
            `;
            document.getElementById('contactInfo').innerHTML = html;
        }

        function renderSalesHistory(sales) {
            if (!sales || sales.length === 0) {
                document.getElementById('salesTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">No sales data available</td></tr>';
                return;
            }

            // Sort by year desc, month order
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            sales.sort((a, b) => {
                if (a.year !== b.year) return b.year - a.year;
                return months.indexOf(b.month) - months.indexOf(a.month);
            });

            // Group by year for chart
            const yearData = {};
            sales.forEach(s => {
                if (!yearData[s.year]) yearData[s.year] = 0;
                yearData[s.year] += s.amount;
            });

            updateSalesChart(yearData);

            // Render table
            let ytd = 0;
            let currentYear = sales[0]?.year;
            
            const rows = sales.map(s => {
                if (s.year !== currentYear) {
                    ytd = 0;
                    currentYear = s.year;
                }
                ytd += s.amount;
                return `<tr>
                    <td>${s.year}</td>
                    <td>${s.month}</td>
                    <td>$${s.amount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>$${ytd.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
                </tr>`;
            }).join('');

            document.getElementById('salesTableBody').innerHTML = rows;
        }

        function updateSalesChart(yearData) {
            const ctx = document.getElementById('salesChart');
            if (!ctx) return;
            if (chart) chart.destroy();

            const years = Object.keys(yearData).sort();
            const values = years.map(y => yearData[y]);

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [{
                        label: 'Annual Revenue',
                        data: values,
                        backgroundColor: '#e94560',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#a0a0a0' } },
                        x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#a0a0a0' } }
                    }
                }
            });
        }

        async function recordContact() {
            if (!customerId) return;
            try {
                const response = await fetch(`${API_BASE}/api/customers/${customerId}/contact`, { method: 'POST' });
                if (response.ok) {
                    document.getElementById('actionMessage').textContent = '✓ Contact recorded successfully!';
                    setTimeout(() => {
                        document.getElementById('actionMessage').textContent = '';
                        loadCustomer(); // Refresh
                    }, 2000);
                }
            } catch (e) {
                document.getElementById('actionMessage').textContent = '✗ Failed to record contact';
                document.getElementById('actionMessage').style.color = '#f87171';
            }
        }

        function exportCustomer() {
            if (!customerData) return;
            const data = JSON.stringify(customerData, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `customer_${customerId}.json`;
            a.click();
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const err = document.getElementById('error');
            err.textContent = msg;
            err.style.display = 'block';
        }

        function getTierClass(category) {
            if (!category) return '';
            if (category.includes('Top 165')) return 'tier-top165';
            if (category.includes('Spot On')) return 'tier-spoton';
            if (category.includes('Prime')) return 'tier-prime';
            if (category.includes('PPCL')) return 'tier-ppcl';
            return '';
        }

        function escapeHtml(text) {
            if (!text) return 'N/A';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadCustomer);
    </script>
</body>
</html>
