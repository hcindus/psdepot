<!DOCTYPE html>
<html>
<head>
    <title>DepotChaos Test</title>
<style>
@keyframes patriotic-blink {
    0%, 100% { color: #ff0000; text-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }
    33% { color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
    66% { color: #0066ff; text-shadow: 0 0 8px rgba(0, 102, 255, 0.6); }
}
.patriotic-phone { animation: patriotic-blink 2s infinite; font-weight: 700; display: inline-block; }
</style>
</head>
<body>
<header style="background:#0A1A2F;color:#fff;padding:10px 20px;text-align:center;"><a href="tel:888-881-6834" class="patriotic-phone" style="text-decoration:none;">📞 (888) 881-6834</a> <a href="tel:415-571-9724" style="text-decoration:none;">📞 (415) 571-9724</a> <a href="mailto:info@psdepot.com" style="text-decoration:none;">✉️ info@psdepot.com</a></header>

    <h1>API Test</h1>
    <div id="result">Loading...</div>
    <pre id="raw"></pre>
    
    <script>
        const API_BASE = '/api';
        
        async function test() {
            console.log('Starting test...');
            try {
                const response = await fetch(`${API_BASE}/stats`);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    document.getElementById('result').textContent = `Error: ${response.status}`;
                    return;
                }
                
                const data = await response.json();
                console.log('Data:', data);
                
                document.getElementById('result').textContent = 
                    `Total Leads: ${data.total_leads}, Intelligence: ${data.intelligence_records}`;
                document.getElementById('raw').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        }
        
        document.addEventListener('DOMContentLoaded', test);
    </script>
<footer style="background:#0A1A2F;color:#fff;padding:20px;text-align:center;font-size:14px;"><p><a href="tel:888-881-6834" class="patriotic-phone" style="text-decoration:none;">📞 (888) 881-6834</a></p></footer>
</body>
</html>
