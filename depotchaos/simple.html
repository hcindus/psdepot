<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DepotChaos - Simple Test</title>
    <style>
@keyframes patriotic-blink {
    0%, 100% { color: #ff0000; text-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }
    33% { color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
    66% { color: #0066ff; text-shadow: 0 0 8px rgba(0, 102, 255, 0.6); }
}
.patriotic-phone { animation: patriotic-blink 2s infinite; font-weight: 700; display: inline-block; }

        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .header { background: #1e293b; padding: 20px; margin: -20px -20px 20px -20px; border-bottom: 1px solid #334155; }
        .header h1 { margin: 0; color: #6366f1; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        @media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card-label { color: #94a3b8; font-size: 14px; margin-bottom: 8px; }
        .card-value { font-size: 32px; font-weight: bold; color: #6366f1; }
        .loading { color: #94a3b8; font-style: italic; }
        .error { color: #ef4444; }
        .success { color: #22c55e; }
        pre { background: #1e293b; padding: 15px; border-radius: 8px; overflow: auto; font-size: 12px; }
        button { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #4f46e5; }
        #status { padding: 10px; margin-top: 10px; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 500; }
    </style>
</head>
<body>
<header style="background:#0A1A2F;color:#fff;padding:10px 20px;text-align:center;"><a href="tel:888-881-6834" class="patriotic-phone" style="text-decoration:none;">📞 (888) 881-6834</a> <a href="tel:415-571-9724" style="text-decoration:none;">📞 (415) 571-9724</a> <a href="mailto:info@psdepot.com" style="text-decoration:none;">✉️ info@psdepot.com</a></header>

    <div class="header">
        <h1>DepotChaos - Simple Dashboard</h1>
    </div>
    
    <div id="status" class="loading">Connecting to API...</div>
    
    <div class="stats" id="stats-container">
        <div class="card">
            <div class="card-label">Total Leads</div>
            <div class="card-value" id="stat-total">-</div>
        </div>
        <div class="card">
            <div class="card-label">DataDepot</div>
            <div class="card-value" id="stat-datadepot">-</div>
        </div>
        <div class="card">
            <div class="card-label">Contacted</div>
            <div class="card-value" id="stat-contacted">-</div>
        </div>
        <div class="card">
            <div class="card-label">Intelligence</div>
            <div class="card-value" id="stat-intel">-</div>
        </div>
    </div>
    
    <button onclick="loadData()">Reload Data</button>
    
    <h2>Recent Activities</h2>
    <div id="activities-container">Loading...</div>
    
    <h2>Debug Output</h2>
    <pre id="debug">Waiting for API call...</pre>
    
    <script>
        const API_BASE = '/api';
        
        function log(msg) {
            const debug = document.getElementById('debug');
            debug.textContent += '\n' + new Date().toISOString().substr(11,8) + ' ' + msg;
            console.log(msg);
        }
        
        async function loadData() {
            const status = document.getElementById('status');
            status.className = 'loading';
            status.textContent = 'Fetching data...';
            
            try {
                log('Starting API fetch...');
                
                // Fetch stats
                log('Fetching /api/stats...');
                const statsResponse = await fetch(API_BASE + '/stats');
                log('Stats response: ' + statsResponse.status);
                
                if (!statsResponse.ok) {
                    throw new Error('Stats API error: ' + statsResponse.status);
                }
                
                const stats = await statsResponse.json();
                log('Stats data: ' + JSON.stringify(stats, null, 2));
                
                // Update stats
                document.getElementById('stat-total').textContent = stats.total_leads || 0;
                document.getElementById('stat-datadepot').textContent = stats.datadepot_leads || 0;
                document.getElementById('stat-intel').textContent = stats.intelligence_records || 0;
                
                const contacted = stats.by_status?.contacted || 0;
                document.getElementById('stat-contacted').textContent = contacted;
                
                // Fetch activities
                log('Fetching /api/activities...');
                const activitiesResponse = await fetch(API_BASE + '/activities');
                log('Activities response: ' + activitiesResponse.status);
                
                const activities = await activitiesResponse.json();
                log('Activities count: ' + activities.length);
                
                // Render activities
                const actContainer = document.getElementById('activities-container');
                if (activities.length === 0) {
                    actContainer.innerHTML = '<p>No recent activities</p>';
                } else {
                    let html = '<table><thead><tr><th>Type</th><th>Description</th><th>Campaign</th></tr></thead><tbody>';
                    activities.slice(0, 5).forEach(a => {
                        html += `<tr><td>${a.type || '-'}</td><td>${a.description || '-'}</td><td>${a.campaign || '-'}</td></tr>`;
                    });
                    html += '</tbody></table>';
                    actContainer.innerHTML = html;
                }
                
                status.className = 'success';
                status.textContent = 'Connected! Data loaded successfully.';
                
            } catch (error) {
                log('ERROR: ' + error.message);
                status.className = 'error';
                status.textContent = 'Error: ' + error.message;
                document.getElementById('activities-container').textContent = 'Failed to load: ' + error.message;
            }
        }
        
        // Load on page load
        log('Page loaded at ' + new Date().toISOString());
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
<footer style="background:#0A1A2F;color:#fff;padding:20px;text-align:center;font-size:14px;"><p><a href="tel:888-881-6834" class="patriotic-phone" style="text-decoration:none;">📞 (888) 881-6834</a></p></footer>
</body>
</html>
